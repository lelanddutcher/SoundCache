name: relay-worker

on:
  pull_request:
    paths: ["relay-worker/**", ".github/workflows/relay-worker.yml"]
  push:
    branches: [main]
    paths: ["relay-worker/**", ".github/workflows/relay-worker.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^22.23.4"  # Node security release 2026-10-20
          cache: npm
          cache-dependency-path: relay-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
